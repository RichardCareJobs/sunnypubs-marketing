name: Build blog

on:
  push:
    branches: [main]
    paths:
      - 'blog/posts/**'
      - 'blog/blog-render.js'
      - 'blog/blog.css'
      - 'blog/blog.js'
      - 'scripts/build-blog.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate blog pages from Markdown
        run: node scripts/build-blog.js

      - name: Commit generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A blog sitemap.xml
          if git diff --cached --quiet; then
            echo "Blog already up to date."
          else
            git commit -m "Rebuild blog pages from Markdown"
            git push
          fi
